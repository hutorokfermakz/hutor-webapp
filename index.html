<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Хуторок</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <div class="top">

    <h1>🌾 Хуторок</h1>

    <div class="stats">

      <div class="stat">
        💰 <span id="coins">100</span>
      </div>

      <div class="stat">
        ⭐ <span id="xp">0</span>
      </div>

      <div class="stat">
        ⚡ <span id="energy">20</span>
      </div>

    </div>

  </div>

  <h2 class="title">🌱 Ферма</h2>

  <div class="seeds">

    <button class="seed-btn" data-seed="wheat">
      🌾 Пшеница
    </button>

    <button class="seed-btn" data-seed="corn">
      🌽 Кукуруза
    </button>

  </div>

  <div class="farm-grid">

    <div class="plot" data-id="0">
      Пусто
    </div>

    <div class="plot" data-id="1">
      Пусто
    </div>

    <div class="plot" data-id="2">
      Пусто
    </div>

    <div class="plot" data-id="3">
      Пусто
    </div>

  </div>

</div>

<script src="app.js"></script>
</body>
</html>
