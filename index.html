<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no
    "
  >

  <title>
    Хуторок 🍃
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

  <div id="app">

    <!-- TOP BAR -->

    <header class="topbar">

      <div class="profile-mini">

        <img
          id="avatar"
          src="https://i.imgur.com/6VBx3io.png"
        >

        <div>

          <div id="playerName">
            Игрок
          </div>

          <div id="playerLevel">
            ⭐ 1 уровень
          </div>

        </div>

      </div>

      <div class="coins-box">

        💰
        <span id="coins">
          0
        </span>

      </div>

    </header>

    <!-- WEATHER -->

    <div id="weatherBar">

      ☀️ Солнечно
      (+10% продажа)

    </div>

    <!-- MAIN SCREEN -->

    <main id="screen">

    </main>

    <!-- NAVBAR -->

    <nav class="navbar">

      <button onclick="openScreen('farm')">
        🌱
      </button>

      <button onclick="openScreen('shop')">
        🛒
      </button>

      <button onclick="openScreen('inventory')">
        🎒
      </button>

      <button onclick="openScreen('profile')">
        👤
      </button>

      <button onclick="openScreen('leaderboard')">
        🏆
      </button>

    </nav>

  </div>

  <!-- Telegram -->

  <script src="
    https://telegram.org/js/telegram-web-app.js
  "></script>

  <!-- Supabase -->

  <script src="
    https://cdn.jsdelivr.net/npm/@supabase/supabase-js
  "></script>

  <!-- CORE -->

  <script src="js/core/config.js"></script>
  <script src="js/core/telegram.js"></script>
  <script src="js/core/supabase.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/database.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/sound.js"></script>

  <!-- DATA -->

  <script src="js/data/crops.js"></script>
  <script src="js/data/shop.js"></script>

  <!-- SYSTEMS -->

  <script src="js/systems/farm.js"></script>
  <script src="js/systems/inventory.js"></script>
  <script src="js/systems/shop.js"></script>
  <script src="js/systems/profile.js"></script>
  <script src="js/systems/weather.js"></script>

  <!-- UI -->

  <script src="js/ui/navbar.js"></script>
  <script src="js/ui/screens.js"></script>
  <script src="js/ui/renderer.js"></script>

  <!-- APP -->

  <script src="app.js"></script>

</body>
</html>
