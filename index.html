<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Хуторок</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="topbar">

    <div class="profile">

      <div class="avatar">
        🚜
      </div>

      <div>
        <div id="playerName">Фермер</div>

        <div class="level">
          ⭐ <span id="level">1</span>
        </div>
      </div>

    </div>

    <div class="coins-box">
      💰 <span id="coins">0</span>
    </div>

  </div>

  <div class="farm-wrapper">

    <div id="farmSection" class="farm-grid">

      <div class="farm-tile" data-id="1"></div>
      <div class="farm-tile" data-id="2"></div>
      <div class="farm-tile" data-id="3"></div>

      <div class="farm-tile" data-id="4"></div>
      <div class="farm-tile" data-id="5"></div>
      <div class="farm-tile" data-id="6"></div>

    </div>

  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <script src="js/supabase.js"></script>
  <script src="js/database.js"></script>
  <script src="js/timers.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/farm.js"></script>

  <script src="app.js"></script>

</body>
</html>
