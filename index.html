<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no
        "
    />

    <title>
        HUTOROK v7
    </title>

    <!-- TELEGRAM -->

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- STYLES -->

    <link
        rel="stylesheet"
        href="./styles/main.css"
    />

</head>

<body>

    <!-- APP -->

    <div id="app">

        <!-- BACKGROUND -->

        <div class="background-layer"></div>

        <!-- TOPBAR -->

        <header class="topbar glass">

            <div class="topbar-left">

                <div class="game-logo">
                    HUTOROK
                </div>

            </div>

            <div class="topbar-right">

                <div class="currency-card glass">

                    <span class="currency-icon">
                        ⬢
                    </span>

                    <span id="coins-value">
                        0
                    </span>

                </div>

            </div>

        </header>

        <!-- MAIN -->

        <main id="screen-container">

            <!-- FARM SCREEN -->

            <section
                id="farm-screen"
                class="screen active"
            >

                <div class="screen-content">

                    <div class="screen-header">

                        <h1>
                            Ферма
                        </h1>

                        <p>
                            Управляйте своей фермой
                        </p>

                    </div>

                    <div
                        id="farm-grid"
                        class="farm-grid"
                    ></div>

                </div>

            </section>

            <!-- INVENTORY -->

            <section
                id="inventory-screen"
                class="screen"
            >

                <div class="screen-content">

                    <div class="screen-header">

                        <h1>
                            Инвентарь
                        </h1>

                        <p>
                            Ваши ресурсы
                        </p>

                    </div>

                    <div
                        id="inventory-grid"
                        class="inventory-grid"
                    ></div>

                </div>

            </section>

            <!-- SHOP -->

            <section
                id="shop-screen"
                class="screen"
            >

                <div class="screen-content">

                    <div class="screen-header">

                        <h1>
                            Магазин
                        </h1>

                        <p>
                            Покупка семян
                        </p>

                    </div>

                    <div
                        id="shop-grid"
                        class="shop-grid"
                    ></div>

                </div>

            </section>

            <!-- PROFILE -->

            <section
                id="profile-screen"
                class="screen"
            >

                <div class="screen-content">

                    <div class="screen-header">

                        <h1>
                            Профиль
                        </h1>

                        <p>
                            Ваш прогресс
                        </p>

                    </div>

                    <div
                        id="profile-container"
                    ></div>

                </div>

            </section>

            <!-- CLANS -->

            <section
                id="clans-screen"
                class="screen"
            >

                <div class="screen-content">

                    <div class="screen-header">

                        <h1>
                            Кланы
                        </h1>

                        <p>
                            Социальная система
                        </p>

                    </div>

                    <div
                        id="clans-container"
                    ></div>

                </div>

            </section>

        </main>

        <!-- NAVIGATION -->

        <nav class="bottom-nav glass">

            <button
                class="nav-btn active"
                data-screen="farm-screen"
            >
                Ферма
            </button>

            <button
                class="nav-btn"
                data-screen="inventory-screen"
            >
                Инвентарь
            </button>

            <button
                class="nav-btn"
                data-screen="shop-screen"
            >
                Магазин
            </button>

            <button
                class="nav-btn"
                data-screen="profile-screen"
            >
                Профиль
            </button>

            <button
                class="nav-btn"
                data-screen="clans-screen"
            >
                Кланы
            </button>

        </nav>

    </div>

    <!-- MAIN -->

    <script
        type="module"
        src="./js/main.js"
    ></script>

</body>

</html>
