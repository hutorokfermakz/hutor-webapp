<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Хуторок MMO</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="profile">

      <img
        class="avatar"
        src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
      >

      <h1 id="playerName">Фермер</h1>

      <div class="stats">
        <p>💰 <span id="coins">500</span></p>
        <p>⭐ <span id="level">1</span></p>
      </div>

      <div class="xp-bar">
        <div id="xpFill"></div>
      </div>

    </div>

    <div class="menu">

      <button class="menu-btn" id="farmBtn">
        🌾 Ферма
      </button>

      <button class="menu-btn" id="shopBtn">
        🛒 Магазин
      </button>

      <button class="menu-btn" id="clanBtn">
        🛡 Кланы
      </button>

      <button class="menu-btn" id="caseBtn">
        🎁 Кейсы
      </button>

    </div>

  </div>

  <script src="app.js"></script>

</body>
</html>
