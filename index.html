<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Хуторок</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <div class="card">

    <img
      class="avatar"
      src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
    >

    <h1 id="playerName">Фермер</h1>

    <div class="stats">
      💰 <span id="coins">500</span>
    </div>

    <div class="stats">
      ⭐ <span id="level">1</span>
    </div>

    <div class="xp-bar">
      <div id="xpFill"></div>
    </div>

  </div>

  <button id="farmBtn" class="menu-btn">
    🌾 Ферма
  </button>
  
<div id="farmSection" class="farm-grid">

  <div class="farm-tile" data-id="1">
    🟫
  </div>

  <div class="farm-tile" data-id="2">
    🟫
  </div>

  <div class="farm-tile" data-id="3">
    🟫
  </div>

  <div class="farm-tile" data-id="4">
    🟫
  </div>

  <div class="farm-tile" data-id="5">
    🟫
  </div>

  <div class="farm-tile" data-id="6">
    🟫
  </div>

</div>
  <button id="shopBtn" class="menu-btn">
    🛒 Магазин
  </button>

  <button id="clanBtn" class="menu-btn">
    🛡 Кланы
  </button>

  <button id="caseBtn" class="menu-btn">
    🎁 Кейсы
  </button>

  <div id="farm" class="farm-grid">

    <div class="farm-tile" data-tile="0">🟫</div>
    <div class="farm-tile" data-tile="1">🟫</div>
    <div class="farm-tile" data-tile="2">🟫</div>

    <div class="farm-tile" data-tile="3">🟫</div>
    <div class="farm-tile" data-tile="4">🟫</div>
    <div class="farm-tile" data-tile="5">🟫</div>

  </div>

</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="js/supabase.js"></script>
<script src="js/database.js"></script>
<script src="js/timers.js"></script>
<script src="js/profile.js"></script>
<script src="js/farm.js"></script>
<script src="app.js"></script>

</body>
</html>
