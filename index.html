<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no
    "
  />

  <title>HUTOROK v7</title>

  <link
    rel="stylesheet"
    href="./styles/main.css?v=900"
  />

</head>

<body>

  <div class="app">

    <!-- BACKGROUND -->

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <!-- FARM SCREEN -->

    <section
      id="farm-screen"
      class="screen active"
    >

      <div class="farm-hero">

        <!-- HERO HEADER -->

        <div class="hero-header">

          <div class="hero-logo">
            HUTOROK
          </div>

          <div class="hero-balance">

            <div class="balance-card">

              <span>
                Монеты
              </span>

              <strong id="coins-balance">
                500
              </strong>

            </div>

            <div class="balance-card">

              <span>
                Кристаллы
              </span>

              <strong id="crystals-balance">
                25
              </strong>

            </div>

          </div>

        </div>

        <!-- WELCOME -->

        <div class="welcome-card">

          <div class="welcome-title">
            Добро пожаловать
          </div>

          <div class="welcome-subtitle">
            Построй свою premium ферму
            нового поколения.
          </div>

        </div>

        <!-- STATS -->

        <div class="stats-grid">

          <div class="stat-card">

            <div class="stat-label">
              Уровень
            </div>

            <div class="stat-value">
              3
            </div>

          </div>

          <div class="stat-card">

            <div class="stat-label">
              Урожай
            </div>

            <div class="stat-value">
              248
            </div>

          </div>

          <div class="stat-card">

            <div class="stat-label">
              Онлайн
            </div>

            <div class="stat-value">
              1.2K
            </div>

          </div>

        </div>

        <!-- FARM GRID -->

        <div class="farm-grid"></div>

      </div>

    </section>

    <!-- SHOP SCREEN -->

  <section class="screen" id="shop-screen">

    <div class="glass-card">

      <h2>Магазин</h2>

    </div>

  </section>

    <!-- INVENTORY SCREEN -->

    <section
      id="inventory-screen"
      class="screen"
    >
    </section>

    <!-- CLANS SCREEN -->

    <section
      id="clans-screen"
      class="screen"
    >
    </section>

    <!-- CHAT SCREEN -->

    <section
      id="chat-screen"
      class="screen"
    >
    </section>

    <!-- PROFILE SCREEN -->

    <section
      id="profile-screen"
      class="screen"
    >
    </section>

    <!-- BOTTOM NAVIGATION -->

    <nav class="bottom-nav">

      <button
        class="nav-btn active"
        data-screen="farm"
      >
        Ферма
      </button>

      <button
        class="nav-btn"
        data-screen="shop"
      >
        Магазин
      </button>

      <button
        class="nav-btn"
        data-screen="inventory"
      >
        Инвентарь
      </button>

      <button
        class="nav-btn"
        data-screen="clans"
      >
        Кланы
      </button>

      <button
        class="nav-btn"
        data-screen="chat"
      >
        Чат
      </button>

      <button
        class="nav-btn"
        data-screen="profile"
      >
        Профиль
      </button>

    </nav>

  </div>

  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <!-- MAIN -->

  <script
    type="module"
    src="./js/main.js?v=900"
  ></script>

</body>
</html>
