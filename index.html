<!-- index.html -->

<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Хуторок 🍃</title>

  <!-- Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- JS -->
  <script src="app.js" defer></script>
</head>

<body>

  <!-- PROFILE -->
  <div class="profile-card">

    <label for="avatarInput">
      <img
        id="avatar"
        src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
      >
    </label>

    <input type="file" id="avatarInput" hidden>

    <h1 id="playerName">Фермер</h1>

    <div class="stats">
      💰 <span id="money">500</span>
    </div>

    <div class="stats">
      ⭐ Уровень:
      <span id="level">1</span>
    </div>

    <div class="xp-bar">
      <div id="xpFill"></div>
    </div>

  </div>

  <!-- FARM -->
  <div class="farm-grid">

    <div class="farm-slot" id="slot1">🟫</div>
    <div class="farm-slot" id="slot2">🟫</div>
    <div class="farm-slot" id="slot3">🟫</div>

    <div class="farm-slot" id="slot4">🟫</div>
    <div class="farm-slot" id="slot5">🟫</div>
    <div class="farm-slot" id="slot6">🟫</div>

    <div class="farm-slot" id="slot7">🟫</div>
    <div class="farm-slot" id="slot8">🟫</div>
    <div class="farm-slot" id="slot9">🟫</div>

  </div>

  <!-- BUTTONS -->
  <button id="farmBtn">
    🌾 Посадить пшеницу
  </button>

  <button id="caseBtn">
    🎁 Открыть кейс
  </button>

</body>

</html>
