<!DOCTYPE html>
<html lang="ru">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no
    "
  />

  <title>Хуторок 🍃</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,
    body{

      width:100%;
      height:100%;

      overflow:hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          #123f2c 0%,
          #07150f 45%,
          #000000 100%
        );

      color:white;

    }

    body{

      display:flex;
      align-items:center;
      justify-content:center;

      position:relative;

    }

    .background-glow{

      position:absolute;

      width:500px;
      height:500px;

      border-radius:50%;

      background:
        radial-gradient(
          circle,
          rgba(0,255,140,.18),
          transparent 70%
        );

      filter:blur(80px);

      animation:
        pulse 6s ease-in-out infinite;

    }

    @keyframes pulse{

      0%{
        transform:scale(1);
        opacity:.5;
      }

      50%{
        transform:scale(1.15);
        opacity:.9;
      }

      100%{
        transform:scale(1);
        opacity:.5;
      }

    }

    .maintenance-card{

      position:relative;

      width:92%;
      max-width:430px;

      padding:42px 32px;

      border-radius:32px;

      background:
        rgba(255,255,255,.06);

      border:
        1px solid rgba(255,255,255,.08);

      backdrop-filter:blur(28px);

      box-shadow:
        0 20px 60px rgba(0,0,0,.45);

      text-align:center;

      z-index:2;

    }

    .logo{

      font-size:42px;
      font-weight:800;

      letter-spacing:1px;

    }

    .leaf{

      display:inline-block;

      animation:
        floatLeaf 3s ease-in-out infinite;

    }

    @keyframes floatLeaf{

      0%{
        transform:translateY(0px);
      }

      50%{
        transform:translateY(-6px);
      }

      100%{
        transform:translateY(0px);
      }

    }

    .status{

      margin-top:28px;

      font-size:20px;
      font-weight:700;

      color:#8dffbf;

    }

    .description{

      margin-top:16px;

      line-height:1.7;

      font-size:15px;

      opacity:.72;

    }

    .loader{

      width:58px;
      height:58px;

      margin:
        34px auto 0;

      border-radius:50%;

      border:
        3px solid rgba(255,255,255,.08);

      border-top:
        3px solid #00ff99;

      animation:
        spin 1.1s linear infinite;

    }

    @keyframes spin{

      from{
        transform:rotate(0deg);
      }

      to{
        transform:rotate(360deg);
      }

    }

    .footer{

      margin-top:28px;

      font-size:13px;

      opacity:.45;

      letter-spacing:.5px;

    }

  </style>

</head>
<body>

  <div class="background-glow"></div>

  <div class="maintenance-card">

    <div class="logo">
      ХУТОРОК
      <span class="leaf">🍃</span>
    </div>

    <div class="status">
      ТЕХНИЧЕСКИЕ РАБОТЫ
    </div>

    <div class="description">

      Мы готовим большое обновление
      с новыми системами, атмосферой
      и online-функциями.

      <br><br>

      Серверы скоро снова откроются.

    </div>

    <div class="loader"></div>

    <div class="footer">
      HUTOROK v7
    </div>

  </div>

</body>
</html>
