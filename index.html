<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Хуторок 🍃</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div class="app">

  <div class="profile">
    <img id="avatar" src="https://i.imgur.com/6VBx3io.png">

    <h1 id="playerName">Фермер</h1>

    <div class="stats">
      <div>💰 <span id="money">500</span></div>
      <div>⭐ <span id="stars">0</span></div>
    </div>

    <div class="xp-bar">
      <div class="xp-fill"></div>
    </div>
  </div>

  <button class="menu-btn" id="farmBtn">
    🌾 Ферма
  </button>

  <button class="menu-btn" id="shopBtn">
    🛒 Магазин
  </button>

  <button class="menu-btn" id="clanBtn">
    🛡 Кланы
  </button>

  <button class="menu-btn" id="caseBtn">
    🎁 Кейсы
  </button>

</div>

<script src="app.js"></script>

</body>
</html>
