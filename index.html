<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Хуторок 🍃</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
overflow:hidden;
background:
radial-gradient(circle at top,
#143326 0%,
#08110d 50%,
#040605 100%);
height:100vh;
color:white;
}

.bg-glow{
position:absolute;
width:500px;
height:500px;

background:
rgba(30,255,140,.12);

filter:blur(120px);

border-radius:50%;

top:-150px;
left:50%;
transform:translateX(-50%);
}

.particles{

position:absolute;

width:100%;
height:100%;

overflow:hidden;

}

.particle{

position:absolute;

background:

rgba(120,255,180,.18);

border-radius:50%;

animation:float 12s infinite linear;

}

@keyframes float{

0%{
transform:
translateY(100vh);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:
translateY(-100px);
opacity:0;
}

}

.container{

position:relative;

z-index:10;

height:100%;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}

.card{

width:100%;
max-width:430px;

background:

rgba(18,30,23,.55);

backdrop-filter:

blur(25px);

border:

1px solid rgba(120,255,180,.12);

border-radius:32px;

padding:30px;

box-shadow:

0 0 40px rgba(0,255,120,.08);

}

.logo{

font-size:34px;

font-weight:700;

text-align:center;

margin-bottom:6px;

}

.subtitle{

text-align:center;

opacity:.7;

margin-bottom:25px;

}

.status{

padding:14px;

border-radius:18px;

background:

rgba(0,255,120,.08);

border:

1px solid rgba(0,255,120,.15);

margin-bottom:20px;

}

.status-title{

font-size:15px;

font-weight:700;

margin-bottom:6px;

color:#8cffbf;

}

.progress{

height:10px;

background:

rgba(255,255,255,.06);

border-radius:20px;

overflow:hidden;

margin-top:14px;

}

.progress-fill{

height:100%;

width:35%;

border-radius:20px;

background:

linear-gradient(
90deg,
#2cff85,
#8dffb5
);

animation:
load 3s infinite;

}

@keyframes load{

0%{
width:15%;
}

50%{
width:60%;
}

100%{
width:35%;
}

}

.features{

display:grid;

grid-template-columns:
1fr 1fr;

gap:12px;

margin-top:20px;

}

.feature{

padding:14px;

border-radius:16px;

background:

rgba(255,255,255,.04);

border:

1px solid rgba(255,255,255,.05);

font-size:13px;

}

.footer{

margin-top:24px;

text-align:center;

opacity:.55;

font-size:12px;

}

</style>

</head>

<body>

<div class="bg-glow"></div>

<div class="particles" id="particles"></div>

<div class="container">

<div class="card">

<div class="logo">
Хуторок 🍃
</div>

<div class="subtitle">

Dark Emerald Glass MMO

</div>

<div class="status">

<div class="status-title">

ТЕХНИЧЕСКИЕ РАБОТЫ

</div>

<div>

Мир Хуторок готовится к открытию.

Проводится настройка фермы,
логистики,
кланов,
экономики
и мировых систем.

</div>

<div class="progress">

<div class="progress-fill"></div>

</div>

</div>

<div class="features">

<div class="feature">
🌾 Живая ферма
</div>

<div class="feature">
🚛 Логистика
</div>

<div class="feature">
🛡 Кланы
</div>

<div class="feature">
🌍 Живой мир
</div>

<div class="feature">
🏭 Производство
</div>

<div class="feature">
🧠 AFK мир
</div>

</div>

<div class="footer">

HUTOROK • WORLD CUP

</div>

</div>

</div>

<script>

const container=
document.getElementById(
'particles'
);

for(
let i=0;
i<30;
i++
){

const p=
document.createElement(
'div'
);

p.className=
'particle';

let size=
Math.random()*6+2;

p.style.width=
size+'px';

p.style.height=
size+'px';

p.style.left=
Math.random()*100+'%';

p.style.animationDuration=
(Math.random()*10+8)+'s';

p.style.animationDelay=
Math.random()*5+'s';

container.appendChild(
p
);

}

</script>

</body>
</html>
