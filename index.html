<!-- index.html -->

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>HUTOROK v7</title>

  <link rel="stylesheet" href="./styles/main.css" />
</head>

<body>
  <div class="app">
    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <!-- FARM SCREEN -->

    <section id="farm-screen" class="screen active">
      <div class="farm-hero">

        <!-- HERO HEADER -->

        <div class="hero-header">
          <h1 class="hero-title">
            HUTOROK
          </h1>

          <div class="balance-group">
            <div class="balance-card">
              <span class="balance-label">
                Монеты
              </span>

              <span class="coins-value">
                0
              </span>
            </div>

            <div class="balance-card">
              <span class="balance-label">
                Кристаллы
              </span>

              <span class="crystals-value">
                0
              </span>
            </div>

            <div class="balance-card">
              <span class="balance-label">
                Уровень
              </span>

              <span class="level-value">
                1
              </span>
            </div>
          </div>
        </div>

        <!-- WELCOME CARD -->

        <div class="welcome-card">
          <div class="welcome-content">
            <h2 class="welcome-title">
              Добро пожаловать в HUTOROK
            </h2>

            <p class="welcome-text">
              Построй свою атмосферную ферму нового поколения.
            </p>
          </div>
        </div>

        <!-- STATS -->

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">
              Уровень
            </div>

            <div class="stat-value">
              1
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-label">
              Урожай
            </div>

            <div class="stat-value">
              0
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-label">
              Онлайн
            </div>

            <div class="stat-value">
              1
            </div>
          </div>
        </div>

        <!-- FARM GRID -->

        <div class="farm-grid"></div>
      </div>
    </section>

    <!-- SHOP SCREEN -->

  <section id="shop-screen" class="screen">
</section>

    <!-- INVENTORY SCREEN -->
    
<section id="inventory-screen" class="screen">
</section>
    
    <!-- CLANS SCREEN -->

    <section id="clans-screen" class="screen">
      <div class="screen-placeholder">
        <h2>Кланы</h2>
      </div>
    </section>

    <!-- CHAT SCREEN -->
    
<section id="chat-screen" class="screen">
</section>
   
    <!-- PROFILE SCREEN -->

    <section id="profile-screen" class="screen">
      <div class="screen-placeholder">
        <h2>Профиль</h2>
      </div>
    </section>

    <!-- BOTTOM NAVIGATION -->

    <nav class="bottom-nav">
      <button class="nav-btn active" data-screen="farm">
        <span>Ферма</span>
      </button>

      <button class="nav-btn" data-screen="shop">
        <span>Магазин</span>
      </button>

      <button class="nav-btn" data-screen="inventory">
        <span>Инвентарь</span>
      </button>

      <button class="nav-btn" data-screen="clans">
        <span>Кланы</span>
      </button>

      <button class="nav-btn" data-screen="chat">
        <span>Чат</span>
      </button>

      <button class="nav-btn" data-screen="profile">
        <span>Профиль</span>
      </button>
    </nav>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
