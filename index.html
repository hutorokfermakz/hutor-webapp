<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>HUTOR 10.0</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <!-- ФОН -->
  <div class="background"></div>

  <!-- HEADER -->
  <header class="topbar">

    <div class="profile-card">
      <div class="avatar">🚜</div>

      <div class="profile-info">
        <h2 id="username">Фермер</h2>

        <div class="level-line">
          <span>LVL 12</span>

          <div class="xp-bar">
            <div class="xp-fill"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="balance-card">
      <div class="money">💰 12 450</div>
      <div class="stars">⭐ 240</div>
    </div>

  </header>

  <!-- СЕЗОН -->
  <section class="season-banner">

    <div>
      <h3>🌾 Весенний сезон</h3>
      <p>До конца: 12 дней</p>
    </div>

    <button>🎁 Забрать</button>

  </section>

  <!-- ОСНОВНАЯ ФЕРМА -->
  <main class="farm-container">

    <!-- ПОЛЕ -->
    <section class="farm-grid">

      <div class="tile planted">
        🌽
        <span>12м</span>
      </div>

      <div class="tile ready">
        🥕
      </div>

      <div class="tile empty">+</div>
      <div class="tile empty">+</div>

      <div class="tile animal">
        🐔
      </div>

      <div class="tile animal">
        🐄
      </div>

      <div class="tile building">
        🏠
      </div>

      <div class="tile building">
        🚜
      </div>

    </section>

    <!-- ПРАВАЯ ПАНЕЛЬ -->
    <aside class="side-panel">

      <div class="panel-card">
        <h3>⚡ Энергия</h3>
        <div class="energy-bar">
          <div class="energy-fill"></div>
        </div>
        <p>84 / 100</p>
      </div>

      <div class="panel-card">
        <h3>🏆 Рейтинг</h3>
        <p>#24 в мире</p>
      </div>

      <div class="panel-card">
        <h3>👥 Клан</h3>
        <p>HUTOR LEGENDS</p>
      </div>

    </aside>

  </main>

  <!-- КЕЙС -->
  <section class="case-banner">

    <div>
      <h3>🎁 Бесплатный кейс</h3>
      <p>Доступен сейчас</p>
    </div>

    <button id="openCase">
      Открыть
    </button>

  </section>

  <!-- НИЖНЕЕ МЕНЮ -->
  <nav class="bottom-nav">

    <button class="nav-btn active">
      🏠
      <span>Ферма</span>
    </button>

    <button class="nav-btn">
      🛒
      <span>Магазин</span>
    </button>

    <button class="nav-btn">
      🐔
      <span>Животные</span>
    </button>

    <button class="nav-btn">
      👥
      <span>Кланы</span>
    </button>

    <button class="nav-btn">
      🏆
      <span>Топ</span>
    </button>

  </nav>

  <script src="app.js"></script>

</body>
</html>
